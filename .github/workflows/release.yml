name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi
          CGO_ENABLED=0 go build -o "dist/octo-db-${GOOS}-${GOARCH}${ext}" .

      - name: Package archive
        run: |
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip "octo-db-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "octo-db-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
          else
            tar -czf "octo-db-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "octo-db-${{ matrix.goos }}-${{ matrix.goarch }}"
          fi

      - name: Generate checksum
        run: |
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            sha256sum "octo-db-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip" > "checksums-${{ matrix.goos }}-${{ matrix.goarch }}.txt"
          else
            sha256sum "octo-db-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" > "checksums-${{ matrix.goos }}-${{ matrix.goarch }}.txt"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums-*.txt
          if-no-files-found: error

  publish_release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact directories
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums-*.txt
